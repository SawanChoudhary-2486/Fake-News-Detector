services:

  mongodb:
    image: mongo:6.0
    container_name: mongo-fake-news
    restart: unless-stopped

    ports:
      - "27017:27017"

  ml-service:
    build: ./Backend/ml-service
    container_name: fake-news-ml
    restart: unless-stopped

    runtime: nvidia

    ports:
      - "8000:8000"

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  backend:
    build: ./Backend
    container_name: fake-news-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./Backend/.env

    depends_on:
      ml-service:
        condition: service_healthy
      mongodb:
        condition: service_started

networks:
  default:
    name: fake-news-network
